# Render Blueprint - deploys the web app + API with managed Postgres and Redis.
# Render dashboard > New > Blueprint > pick this repo. After the first deploy fill the variables marked
# "sync: false" (see docs/RENDER.md). NOTE: written without access to a Render account - not verified end to end.
databases:
  - name: autojobapply-db
    plan: free              # Render's free Postgres expires after ~30 days; use a paid plan for anything lasting
    databaseName: career
    user: career

services:
  - type: keyvalue          # Redis-compatible
    name: autojobapply-redis
    plan: free
    ipAllowList: []         # internal connections only

  - type: web
    name: autojobapply-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - { key: ENVIRONMENT, value: development }   # see docs/RENDER.md - use production once real SMTP and payments are set up
      - { key: SECRET_KEY, generateValue: true }
      - { key: ENCRYPTION_KEY, sync: false }
      - { key: DATABASE_URL, fromDatabase: { name: autojobapply-db, property: connectionString } }
      - { key: REDIS_URL, fromService: { type: keyvalue, name: autojobapply-redis, property: connectionString } }
      - { key: COOKIE_SECURE, value: "true" }
      - { key: FRONTEND_URL, sync: false }         # https://<your web service>.onrender.com
      - { key: API_URL, sync: false }              # same value as FRONTEND_URL (the web app proxies /api)
      - { key: CORS_ORIGINS, sync: false }         # same value as FRONTEND_URL
      - { key: CELERY_TASK_ALWAYS_EAGER, value: "true" }   # run background jobs inside the API (no paid worker needed)
      - { key: EMAIL_PROVIDER, value: console }    # verification links appear in the API logs
      - { key: STORAGE_BACKEND, value: local }     # free tier has no persistent disk: uploaded files are lost on restart. For real use see docs/RENDER.md (S3 / Cloudflare R2)
      - { key: LOCAL_STORAGE_PATH, value: /tmp/storage }
      - { key: AI_PROVIDER, value: mock }
      - { key: BILLING_SANDBOX_ENABLED, value: "true" }
      - { key: ENABLE_MOCK_CONNECTOR, value: "true" }

  - type: web
    name: autojobapply-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - { key: PORT, value: "3000" }
      - { key: BACKEND_HOSTPORT, fromService: { type: web, name: autojobapply-api, property: hostport } }

  # Optional (paid): background worker + scheduler for job discovery and syncing.
  # Then set CELERY_TASK_ALWAYS_EAGER=false on the API and copy its environment variables here.
  # - type: worker
  #   name: autojobapply-worker
  #   runtime: docker
  #   dockerfilePath: ./backend/Dockerfile
  #   dockerContext: .
  #   dockerCommand: celery -A app.tasks.celery_app:celery_app worker -B -Q default,ai,discovery -l info --concurrency 2
  #   plan: starter
