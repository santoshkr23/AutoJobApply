name: Build & publish images
# Publishes images to GitHub Container Registry on version tags. Deploying them to your server is
# environment specific - see docs/DEPLOYMENT.md. No cloud credentials are stored in this repo.
on:
  push: { tags: ["v*"] }
permissions: { contents: read, packages: write }
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, file: backend/Dockerfile, target: api }
          - { name: worker, file: backend/Dockerfile, target: worker }
          - { name: automation, file: backend/Dockerfile, target: automation }
          - { name: beat, file: backend/Dockerfile, target: beat }
          - { name: web, file: frontend/Dockerfile, target: run }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/autojobapply-${{ matrix.name }}:${{ github.ref_name }}
