name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: career, POSTGRES_PASSWORD: career, POSTGRES_DB: career }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U career" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://career:career@localhost:5432/career
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - working-directory: backend
        run: ruff check .
      - working-directory: backend
        run: alembic upgrade head
      - working-directory: backend
        run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env: { BACKEND_URL: "http://localhost:8000" }
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: SECRET_KEY=ci docker compose config -q
      - run: docker build -f backend/Dockerfile --target api -t autojobapply-api .
      - run: docker build -f frontend/Dockerfile -t autojobapply-web .
