<!doctype html><meta charset="utf-8"><title>AutoJobApply</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<body style="font-family:system-ui;max-width:520px;margin:12vh auto;padding:0 16px">
<h2>Can't reach the AutoJobApply server</h2>
<p>The app could not connect to <code id="s"></code>. Start the platform (<code>docker compose up</code>) or check the address, then retry.</p>
<button onclick="desktop.retry()">Retry</button> <button onclick="desktop.openSettings()">Server settings</button>
<script>desktop.getServer().then(v=>document.getElementById('s').textContent=v)</script>
